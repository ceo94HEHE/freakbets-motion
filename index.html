<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>UI Morph</title>
<!--
  One shape, 28 beats, 1440×1440.
  Everything on screen is computed from time inside seek(t): no CSS transitions,
  no timers, nothing carried between frames. render.mjs calls seek() per subframe.
  Opened directly in a browser it plays in real time (click to pause, ?t=4.5 to freeze).
-->
<style>
  @font-face {
    font-family: "Geist";
    src: url("fonts/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }
  :root {
    --canvas: #e8e6e1;
    --ink: #0e0e0e;
    --orange: #ff6b00;
    --gray-d: #8e8e93;
    --gray-l: #8d8a84;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); overflow: hidden; }
  #frame {
    position: relative; width: 1440px; height: 1440px; overflow: hidden;
    background: var(--canvas); transform-origin: 0 0;
    font-family: "Geist", sans-serif; font-synthesis: none;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  /* The camera scales #world. Nothing inside gets will-change, so text re-rasterises at every zoom. */
  #world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
  #shape { position: absolute; overflow: hidden; }
  #shadow { border-radius: 40px; }
  .a { position: absolute; left: 0; top: 0; }
  .grp { visibility: hidden; }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
  svg.fill { fill: currentColor; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; overflow: visible; }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  /* button */
  #gButton { width: 264px; height: 76px; display: flex; align-items: center; justify-content: center; gap: 10px;
             color: #fff; font-size: 22px; font-weight: 560; letter-spacing: -0.012em; transform-origin: 50% 50%; }
  #btnArrow { width: 21px; height: 21px; }

  /* loader + check */
  #gArc { width: 100px; height: 100px; overflow: visible; }
  #gCheck { width: 38px; height: 38px; color: var(--ink); }

  /* island */
  #gIsland { width: 320px; height: 68px; transform-origin: 50% 50%; }
  #gIsland .txt { position: absolute; left: 70px; top: 0; height: 68px; display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  #gIsland .t { color: #fff; font-size: 15px; line-height: 19px; font-weight: 600; letter-spacing: -0.005em; }
  #gIsland .ar { color: var(--gray-d); font-size: 13px; line-height: 16px; font-weight: 450; }
  #gIsland .wave { position: absolute; right: 24px; top: 0; height: 68px; display: flex; align-items: center; gap: 3px; }
  #gIsland .wave i { display: block; width: 3px; border-radius: 2px; background: rgba(255,255,255,0.32); }

  /* album art (thumb in the island, cover in the player) */
  #art { overflow: hidden; }
  #art svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }

  /* player */
  #gPText, #gTrack, #gControls { width: 400px; height: 256px; }
  #gPText { transform-origin: 30% 20%; }
  #gPText .t { position: absolute; left: 132px; top: 38px; color: #fff; font-size: 20px; line-height: 24px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  #gPText .ar { position: absolute; left: 132px; top: 66px; color: var(--gray-d); font-size: 16px; line-height: 20px; font-weight: 450; white-space: nowrap; }
  #trackBg { position: absolute; left: 20px; top: 136px; width: 360px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.18); }
  #gTrack .times { position: absolute; left: 20px; top: 152px; width: 360px; display: flex; justify-content: space-between;
                   color: var(--gray-d); font-size: 13px; line-height: 16px; font-weight: 500; }
  #gControls { transform-origin: 50% 80%; }
  #gControls .prev, #gControls .next { position: absolute; top: 191px; width: 26px; height: 26px; color: #fff; }
  #gControls .prev { left: 111px; }
  #gControls .next { left: 263px; }
  #playBtn { position: absolute; left: 171px; top: 175px; width: 58px; height: 58px; border-radius: 29px; background: var(--orange); }
  #pp { position: absolute; left: 16px; top: 16px; width: 26px; height: 26px; color: var(--ink); }
  #knob { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .spk { width: 24px; height: 24px; }

  /* the white pill: progress fill → volume fill → toggle knob → tab indicator */
  #pill { overflow: hidden; background: #fff; }
  #gTabs, #tabsB { width: 372px; height: 68px; display: flex; padding: 0 6px; }
  #gTabs span, #tabsB span { width: 120px; height: 68px; line-height: 68px; text-align: center; font-size: 16px; font-weight: 550; letter-spacing: -0.005em; }
  #gTabs span { color: var(--gray-d); }
  #tabsB span { color: var(--ink); }

  /* chart */
  #gChartHead { width: 440px; }
  #gChartHead .lab { color: var(--gray-d); font-size: 15px; line-height: 18px; font-weight: 500; }
  #gChartHead .row { display: flex; align-items: baseline; gap: 12px; margin-top: 4px; }
  #gChartHead .val { color: #fff; font-size: 38px; line-height: 44px; font-weight: 620; letter-spacing: -0.025em; }
  #gChartHead .dlt { color: var(--gray-d); font-size: 15px; font-weight: 500; }
  #gChart { width: 480px; height: 191px; overflow: visible; }
  #gChart text { font-family: "Geist", sans-serif; font-size: 12px; font-weight: 500; fill: #6e6e73; }
  #tip { background: #fff; border-radius: 12px; padding: 8px 12px 9px; box-shadow: 0 6px 16px -6px rgba(0,0,0,0.5); white-space: nowrap; }
  #tip .d { color: var(--gray-l); font-size: 12px; line-height: 15px; font-weight: 500; }
  #tip .v { color: var(--ink); font-size: 16px; line-height: 20px; font-weight: 620; letter-spacing: -0.01em; }
  #chip { display: flex; align-items: center; justify-content: center; gap: 1px; font-weight: 550; }
  #chip svg { flex: none; }

  /* search / palette */
  #gSearch { width: 440px; height: 68px; }
  #gSearch .sic { position: absolute; left: 20px; top: 23px; width: 22px; height: 22px; color: #1a1a1a; }
  #gSearch .inp { position: absolute; left: 58px; top: 0; height: 68px; display: flex; align-items: center;
                  font-size: 18px; font-weight: 450; color: #111; letter-spacing: -0.005em; }
  #ph { position: absolute; left: 0; top: 0; line-height: 68px; color: #9b9892; white-space: nowrap; }
  #caret { display: inline-block; width: 2px; height: 22px; margin-left: 1px; border-radius: 1px; background: #111; }
  #divider { width: 440px; height: 1px; background: #ecebe6; }
  #hl { width: 424px; height: 48px; border-radius: 12px; background: #f1efea; }
  .row { width: 440px; height: 52px; }
  .row > .ic { position: absolute; left: 21px; top: 16px; width: 20px; height: 20px; color: #3b3935; }
  .row .lb { position: absolute; left: 58px; top: 0; line-height: 52px; font-size: 16px; font-weight: 500; color: #111; letter-spacing: -0.005em; }
  .row .sc { position: absolute; right: 24px; top: 0; height: 52px; display: flex; align-items: center; gap: 1px;
             font-size: 13px; font-weight: 500; color: #9b9892; }

  /* toast */
  #gToast { width: 320px; height: 64px; transform-origin: 50% 50%; }
  #gToast .ok { position: absolute; left: 18px; top: 18px; width: 28px; height: 28px; border-radius: 14px; background: var(--orange); }
  #gToast .ok svg { position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; color: var(--ink); }
  #gToast .msg { position: absolute; left: 58px; top: 0; line-height: 64px; color: #fff; font-size: 17px; font-weight: 550; letter-spacing: -0.005em; }
  #gToast .undo { position: absolute; right: 24px; top: 0; line-height: 64px; color: var(--gray-d); font-size: 15px; font-weight: 550; }

  #cursor { position: absolute; left: 0; top: 0; overflow: visible; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.28)); }
</style>
</head>
<body>
<div id="frame">
  <div id="world">
    <div id="shadow" class="a"></div>
    <div id="shape">
      <!-- Button -->
      <div id="gButton" class="a grp"><span>Get started</span><svg id="btnArrow" class="ic" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></div>

      <!-- Loader arc, which floods into the check circle -->
      <svg id="gArc" class="a grp" viewBox="-50 -50 100 100"><circle id="arc" cx="0" cy="0" r="18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      <svg id="gCheck" class="a grp ic" viewBox="0 0 24 24"><path id="checkPath" d="M5 12.5 9.8 17.2 19 7.4"/></svg>

      <!-- Dynamic island -->
      <div id="gIsland" class="a grp">
        <div class="txt"><div class="t" data-title></div><div class="ar" data-artist></div></div>
        <div class="wave"><i style="height:8px"></i><i style="height:15px"></i><i style="height:22px"></i><i style="height:12px"></i><i style="height:6px"></i></div>
      </div>

      <!-- Album art, shared by island and player -->
      <div id="art" class="a grp">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <rect width="100" height="100" fill="#ecebe6"/>
          <circle cx="50" cy="55" r="31" fill="#0e0e0e"/>
          <circle cx="50" cy="55" r="21" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1.2"/>
          <circle cx="50" cy="55" r="13" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.2"/>
          <circle cx="50" cy="55" r="5.5" fill="#ecebe6"/>
        </svg>
      </div>

      <!-- Player -->
      <div id="gPText" class="a grp"><div class="t" data-title></div><div class="ar" data-artist></div></div>
      <div id="gTrack" class="a grp"><div id="trackBg"></div><div class="times tnum"><span id="tEl">0:48</span><span id="tRm">-2:24</span></div></div>
      <div id="gControls" class="a grp">
        <svg class="prev fill" viewBox="0 0 24 24"><path d="M19 5.5 9.5 12l9.5 6.5Z"/><path d="M5.5 5.5v13" fill="none"/></svg>
        <div id="playBtn"><svg id="pp" class="fill" viewBox="0 0 24 24"><path id="pp1"/><path id="pp2"/></svg></div>
        <svg class="next fill" viewBox="0 0 24 24"><path d="M5 5.5 14.5 12 5 18.5Z"/><path d="M18.5 5.5v13" fill="none"/></svg>
      </div>

      <!-- Tabs, grey labels (under the indicator) -->
      <div id="gTabs" class="a grp"><span>Day</span><span>Week</span><span>Month</span></div>

      <!-- Speaker icon, white copy (black copy lives inside the pill) -->
      <svg id="spkA" class="a grp ic spk" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>

      <!-- The white pill: progress fill → volume fill → toggle knob → tab indicator -->
      <div id="pill" class="a grp">
        <svg id="spkB" class="a ic spk" viewBox="0 0 24 24" style="color:#0e0e0e"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <div id="tabsB" class="a"><span>Day</span><span>Week</span><span>Month</span></div>
      </div>
      <div id="knob" class="a grp"></div>

      <!-- Chart -->
      <div id="gChartHead" class="a grp"><div class="lab">Revenue</div><div class="row"><span id="val" class="val tnum">$48,210</span><span class="dlt">+12.4% this week</span></div></div>
      <svg id="gChart" class="a grp" viewBox="0 0 480 191">
        <defs><clipPath id="areaClip"><rect id="areaRect" x="0" y="0" width="0" height="191"/></clipPath></defs>
        <g id="grid" stroke="rgba(255,255,255,0.08)" stroke-width="1"></g>
        <g id="days"></g>
        <path id="area" fill="rgba(255,107,0,0.10)" clip-path="url(#areaClip)"/>
        <path id="line" fill="none" stroke="#ff6b00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line id="guide" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
        <circle id="endDot" r="5.5" fill="#ff6b00" stroke="#0e0e0e" stroke-width="3"/>
        <circle id="hoverDot" r="6" fill="#fff" stroke="#ff6b00" stroke-width="3"/>
      </svg>
      <div id="tip" class="a grp"><div class="d" id="tipD">Sun</div><div class="v tnum" id="tipV">$8,910</div></div>
      <div id="chip" class="a grp"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg><span>K</span></div>

      <!-- Search / palette -->
      <div id="gSearch" class="a grp">
        <svg class="sic ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></svg>
        <div class="inp"><span id="ph">Search commands…</span><span id="c1">s</span><span id="c2">a</span><span id="caret"></span></div>
      </div>
      <div id="divider" class="a grp"></div>
      <div id="hl" class="a grp"></div>
      <div id="row0" class="a grp row"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8Z"/><path d="M14 2.5V8h5.5"/></svg><span class="lb">Search files</span><span class="sc"><svg class="ic" viewBox="0 0 24 24" width="13" height="13"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>P</span></div>
      <div id="row1" class="a grp row"><svg class="ic" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span class="lb">Share link</span><span class="sc"><svg class="ic" viewBox="0 0 24 24" width="13" height="13"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>L</span></div>
      <div id="row2" class="a grp row"><svg class="ic" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg><span class="lb">Save changes</span><span class="sc"><svg class="ic" viewBox="0 0 24 24" width="13" height="13"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>S</span></div>
      <div id="row3" class="a grp row"><svg class="ic" viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg><span class="lb">Settings</span><span class="sc"><svg class="ic" viewBox="0 0 24 24" width="13" height="13"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>,</span></div>

      <!-- Toast -->
      <div id="gToast" class="a grp">
        <div class="ok"><svg class="ic" viewBox="0 0 24 24" style="stroke-width:3"><path d="M5 12.5 9.8 17.2 19 7.4"/></svg></div>
        <span class="msg">Changes saved</span><span class="undo">Undo</span>
      </div>
    </div>
  </div>
  <svg id="cursor" viewBox="-2 -2 24 34" width="45" height="63.75">
    <path d="M0 0v24l6-5.5 4 9 4-1.8-3.8-8.7H18Z" fill="#0e0e0e" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>
</div>

<script>
'use strict';
// ─── Track credit ───────────────────────────────────────────────────────────
const TRACK = window.__TRACK__ || { title: 'Song title', artist: 'Artist name', duration: 192 };

// ─── Timing ─────────────────────────────────────────────────────────────────
// Everything is placed in beats. The renderer injects the measured tempo.
const GRID = window.__GRID__ || {};
const BPM = GRID.bpm || 120;
const BEAT = 60 / BPM;
const NB = 28;                       // 7 bars of 4
const T = NB * BEAT;                 // loop length in seconds
const bt = n => n * BEAT;            // beats → seconds
const wrap = x => { x %= T; return x < 0 ? x + T : x; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const mix = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);

// ─── Springs ────────────────────────────────────────────────────────────────
// r = response (s), d = damping fraction. Closed-form, so any value is a pure function of time.
const SP = {
  shape:   { r: 0.40, d: 0.82 },
  color:   { r: 0.30, d: 1 },
  quick:   { r: 0.17, d: 1 },
  camPos:  { r: 0.58, d: 1 },
  camZoom: { r: 0.74, d: 1 },
  enter:   { r: 0.36, d: 0.92 },
  exit:    { r: 0.13, d: 1 },
  char:    { r: 0.18, d: 0.9 },
  lead:    { r: 0.21, d: 0.86 },
  trail:   { r: 0.42, d: 0.92 },
  snap:    { r: 0.24, d: 0.80 },
  pop:     { r: 0.30, d: 0.72 },
  flood:   { r: 0.30, d: 1 },
  draw:    { r: 0.62, d: 1 },
  roll:    { r: 0.72, d: 1 },
  press:   { r: 0.09, d: 1 },
  release: { r: 0.42, d: 0.74 },
  now:     { r: 0 },
};

function stepResp(tau, sp) {           // unit step response, 0 → 1
  if (tau <= 0) return 0;
  if (!(sp.r > 0)) return 1;
  const w = 2 * Math.PI / sp.r, z = sp.d;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * tau) * (Math.cos(wd * tau) + (z * w / wd) * Math.sin(wd * tau));
  }
  return 1 - Math.exp(-w * tau) * (1 + w * tau);
}
function freeResp(tau, x0, v0, sp) {   // released from displacement x0 with velocity v0, target 0
  const w = 2 * Math.PI / sp.r, z = sp.d;
  if (z < 1) {
    const wd = w * Math.sqrt(1 - z * z);
    return Math.exp(-z * w * tau) * (x0 * Math.cos(wd * tau) + ((v0 + z * w * x0) / wd) * Math.sin(wd * tau));
  }
  return Math.exp(-w * tau) * (x0 + (v0 + w * x0) * tau);
}

// A value whose target changes at keyed beats. It is the sum of one spring per change, and the
// keys are cyclic, so the value at T equals the value at 0 (springs still settling at the end
// of the loop carry into its start).
class Track {
  constructor(keys, sp) {
    this.scalar = !Array.isArray(keys[0][1]);
    const k = keys.map(([n, v, s]) => ({ t: wrap(bt(n)), v: this.scalar ? [v] : v, sp: s || sp }));
    k.sort((a, b) => a.t - b.t);
    k.forEach((key, i) => { const prev = k[(i - 1 + k.length) % k.length].v; key.d = key.v.map((x, j) => x - prev[j]); });
    this.k = k;
  }
  at(t) {
    t = wrap(t);
    const k = this.k;
    let cur = k[k.length - 1];
    for (const key of k) { if (key.t <= t) cur = key; else break; }
    const out = cur.v.slice();
    for (const key of k) {
      const tau = wrap(t - key.t);
      if (tau > 4) continue;
      const r = 1 - stepResp(tau, key.sp);
      if (r === 0) continue;
      for (let j = 0; j < out.length; j++) out[j] -= key.d[j] * r;
    }
    return this.scalar ? out[0] : out;
  }
}
const track = (keys, sp = SP.shape) => new Track(keys, sp);
const vis = (inAt, outAt, spIn = SP.enter, spOut = SP.exit) => new Track([[inAt, 1, spIn], [outAt, 0, spOut]]);

// Direct manipulation: inside a window the value is whatever fn() says (computed from the cursor).
// After release it springs from where it was, with the velocity it had, back onto the base track.
class Channel {
  constructor(base, windows) { this.base = base; this.win = windows; }
  baseAt(t) { return typeof this.base === 'number' ? this.base : this.base.at(t); }
  at(t) {
    t = wrap(t);
    let last = null, lastTau = Infinity;
    for (const w of this.win) {
      const a = bt(w.a), b = bt(w.b);
      if (t >= a && t <= b) return w.fn(t);
      const tau = wrap(t - b);
      if (tau < lastTau) { lastTau = tau; last = w; }
    }
    const v = this.baseAt(t);
    if (!last || lastTau > 3) return v;
    const b = bt(last.b), h = 1e-4;
    const x0 = last.fn(b) - this.baseAt(b);
    const v0 = (last.fn(b) - last.fn(b - h)) / h - (this.baseAt(b) - this.baseAt(b - h)) / h;
    return v + freeResp(lastTau, x0, v0, last.sp);
  }
}

// Cursor path: quintic Hermite between keys (zero acceleration at every key, so stops are
// smooth), cyclic so position and speed match across the loop seam. `bend` arcs a segment.
class Path {
  constructor(keys) { this.k = keys.map(([n, x, y, vx = 0, vy = 0, bend = 0]) => ({ t: bt(n), x, y, vx, vy, bend })); }
  at(t) {
    t = wrap(t);
    const k = this.k, n = k.length;
    let i = n - 1;
    for (let j = 0; j < n; j++) if (k[j].t <= t) i = j;
    const a = k[i], b = k[(i + 1) % n];
    const ta = a.t; let tb = b.t, tt = t;
    if (tb <= ta) tb += T;
    if (tt < ta) tt += T;
    const D = tb - ta, u = (tt - ta) / D, u3 = u * u * u, u4 = u3 * u, u5 = u4 * u;

    put(el.gTrack, PL.x, PL.y);
    el.tEl.textContent = mmss(p * TRACK.duration);
    el.tRm.textContent = `-${mmss(TRACK.duration - p * TRACK.duration)}`;
  }
  if (fx(el.gControls, V.controls.at(t))) {
    put(el.gControls, PL.x, PL.y);
    const pop = V.playPop.at(t);
    el.playBtn.style.transform = `scale(${(0.6 + 0.4 * pop).toFixed(4)})`;
    const q = clamp(ppT.at(t), -0.05, 1.05);
    el.pp1.setAttribute('d', quad(PLAY[0].map((pt, i) => mix(pt, PAUSE[0][i], q))));
    el.pp2.setAttribute('d', quad(PLAY[1].map((pt, i) => mix(pt, PAUSE[1][i], q))));
  }

  // the pill (progress fill → volume fill → toggle knob → tab indicator)
  const pR = pillR.at(t), pLv = pillL.at(t), [pT, pB] = pillTB.at(t);
  const pL = Math.min(pLv, pR - 2 * Math.min(pillRad.at(t), (pB - pT) / 2));
  if (fx(el.pill, V.pill.at(t), 4, 1)) {
    box(el.pill, pL, pT, pR - pL, pB - pT);
    el.pill.style.borderRadius = px(Math.min(pillRad.at(t), (pB - pT) / 2, (pR - pL) / 2));
    el.tabsB.style.left = px(-186 - pL); el.tabsB.style.top = px(71 - pT);
    fx(el.tabsB, V.tabs.at(t), 5, 1);
  }
  if (fx(el.knob, V.knob.at(t), 3, 1)) {
    const k = knobT.at(t);
    box(el.knob, pR - k / 2, TR.y - k / 2, k, k);
  }

  // speaker (white copy on the track, black copy clipped inside the pill)
  const [sx, sy] = spkT.at(t), sv = V.spk.at(t);
  if (fx(el.spkA, sv, 4, 1)) { put(el.spkA, sx - 12, sy - 12); el.spkA.style.color = rgb(spkCol.at(t)); }
  el.spkB.style.visibility = sv > 0.002 ? 'inherit' : 'hidden';
  el.spkB.style.opacity = clamp(sv).toFixed(4);
  el.spkB.style.left = px(sx - 12 - pL); el.spkB.style.top = px(sy - 12 - pT);

  // tabs
  if (fx(el.gTabs, V.tabs.at(t), 5, 1)) put(el.gTabs, -186, 71);

  // chart
  if (fx(el.gChartHead, V.chead.at(t))) {
    put(el.gChartHead, CARD.x + 24, CARD.y + 100);
    el.val.textContent = money(48210 * clamp(rollT.at(t)));
  }
  if (fx(el.gChart, V.chart.at(t), 5, 1)) {
    put(el.gChart, CH.ox, CH.oy);
    const d = clamp(drawT.at(t));
    el.line.style.strokeDasharray = `${LINE_LEN} ${LINE_LEN}`;
    el.line.style.strokeDashoffset = (LINE_LEN * (1 - d)).toFixed(3);
    const head = el.line.getPointAtLength(LINE_LEN * d);
    el.areaRect.setAttribute('width', Math.max(0, head.x).toFixed(3));
    const e = endDotT.at(t);
    el.endDot.setAttribute('r', (5.5 * clamp(e, 0, 1.2)).toFixed(3));
    el.endDot.style.visibility = e > 0.01 ? 'inherit' : 'hidden';
  }
  const tv = V.tip.at(t);
  if (tv > 0.002 && V.chart.at(t) > 0.002) {
    const hx = clamp(cursor.at(t).x, PLOT.L, PLOT.R), hy = curveY(hx), o = clamp(tv);
    el.guide.setAttribute('x1', cx(hx)); el.guide.setAttribute('x2', cx(hx));
    el.guide.setAttribute('y1', cy(PLOT.T - 8)); el.guide.setAttribute('y2', cy(PLOT.B));
    el.guide.style.opacity = o;
    el.hoverDot.setAttribute('cx', cx(hx)); el.hoverDot.setAttribute('cy', cy(hy));
    el.hoverDot.setAttribute('r', (6 * clamp(tv, 0, 1.1)).toFixed(3));
    el.guide.style.visibility = el.hoverDot.style.visibility = 'inherit';
    el.tipD.textContent = DAYS[clamp(Math.round((hx - PLOT.L) / ((PLOT.R - PLOT.L) / 6)), 0, 6)];
    el.tipV.textContent = money(Math.round(valueAt(hx) * 100) * 10);
    fx(el.tip, tv, 4, 0.9);
    const tw = 96, th = 52;
    put(el.tip, clamp(hx - tw / 2, CARD.x + 12, CARD.x + 480 - 12 - tw), hy - th - 16);
  } else {
    el.guide.style.visibility = el.hoverDot.style.visibility = 'hidden';
    el.tip.style.visibility = 'hidden';
  }

  // ⌘K chip → search hint
  if (fx(el.chip, V.chip.at(t), 4, 1)) {
    const [kx, ky, kw, kh, kr] = chipRect.at(t), bg = chipBg.at(t);
    box(el.chip, kx, ky, kw, kh);
    el.chip.style.borderRadius = px(kr);
    el.chip.style.background = rgb(bg.slice(0, 3), bg[3]);
    el.chip.style.color = rgb(chipFg.at(t));
    const fs = 6 + kh * 0.19;
    el.chip.style.fontSize = px(fs);
    el.chip.firstChild.setAttribute('width', (fs * 0.95).toFixed(2));
    el.chip.firstChild.setAttribute('height', (fs * 0.95).toFixed(2));
  }

  // search / palette
  if (fx(el.gSearch, V.search.at(t), 5, 1)) {
    put(el.gSearch, SEARCH.x, SEARCH.y);
    fx(el.ph, V.ph.at(t), 4, 1);
    const c1 = V.c1.at(t), c2 = V.c2.at(t);
    el.c1.style.display = n >= 24 && n < 26.5 ? 'inline' : 'none';
    el.c2.style.display = n >= 25 && n < 26.5 ? 'inline' : 'none';
    fx(el.c1, c1, 3, 0.8); fx(el.c2, c2, 3, 0.8);
    el.caret.style.opacity = (((t - bt(23)) % BEAT + BEAT) % BEAT) < BEAT / 2 ? 1 : 0;
  }
  if (fx(el.divider, V.divider.at(t), 0, 1)) put(el.divider, SEARCH.x, SEARCH.y + 68);
  if (fx(el.hl, V.hl.at(t), 3, 1)) put(el.hl, SEARCH.x + 8, ROW_Y[0] - 24);
  [el.row0, el.row1, el.row2, el.row3].forEach((node, i) => {
    const v = V.rows[i].at(t);
    if (!fx(node, v, 5, 1)) return;
    const ry = i === 2 ? row2Y.at(t) : ROW_Y[i];
    put(node, SEARCH.x, ry - 26 + (1 - clamp(v)) * 8);
  });

  // toast
  if (fx(el.gToast, V.toast.at(t))) put(el.gToast, G.toast.x - 160, G.toast.y - 32);

  // cursor (screen space, constant size)
  const c = cursor.at(t), s = pressT.at(t);
  const sxC = 720 + z * (c.x - camX), syC = 720 + z * (c.y - camY);
  el.cursor.style.transform = `translate(${(sxC - 3.75).toFixed(3)}px,${(syC - 3.75).toFixed(3)}px) scale(${s.toFixed(4)})`;
  el.cursor.style.transformOrigin = '3.75px 3.75px';
}

// ─── Boot ──────────────────────────────────────────────────────────────────
window.MORPH = { seek, T, BEAT, BPM, NB, SFX, TRACK };
window.seek = seek;
document.fonts.ready.then(() => {
  seek(0);
  window.__ready = true;
  if (window.__RENDER__) return;
  // Preview only: fit the frame to the window and play in real time.
  const frame = document.getElementById('frame');
  const fit = () => { frame.style.transform = `scale(${Math.min(innerWidth, innerHeight) / 1440})`; };
  fit(); addEventListener('resize', fit);
  const q = new URLSearchParams(location.search);
  if (q.has('t')) { seek(parseFloat(q.get('t'))); return; }
  if (q.has('beat')) { seek(bt(parseFloat(q.get('beat')))); return; }
  let t0 = performance.now(), paused = false, held = 0;
  addEventListener('click', () => { paused = !paused; if (paused) held = (performance.now() - t0) / 1000; else t0 = performance.now() - held * 1000; });
  const loop = now => { if (!paused) seek((now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
